<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VidSqueeze">
  <defs>
    <linearGradient id="vs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#2436C8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#vs)"/>
  <!-- Three bars narrowing downward: the shape of something being squeezed. -->
  <g fill="#fff">
    <rect x="7"    y="8.4"  width="18"   height="3.4" rx="1.7"/>
    <rect x="9.75" y="14.3" width="12.5" height="3.4" rx="1.7"/>
    <rect x="12.5" y="20.2" width="7"    height="3.4" rx="1.7"/>
  </g>
</svg>
